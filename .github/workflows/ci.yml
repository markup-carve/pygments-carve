name: CI

on:
  push:
    branches: [main, next2]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Pull requests share one group per PR so a new push cancels the stale run;
# every other event gets its own group, since GitHub keeps one pending run per group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  test:
    # The spec bump bot force-pushes its draft PR, which is red until marked
    # ready; marking it ready (ready_for_review) runs the full suite.
    if: ${{ !(github.event.pull_request.draft && github.head_ref == 'automation/bump-spec' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.9 is past end of life but still declared (requires-python); it runs
        # daily in eol-runtimes.yml instead of on every PR.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/checkout@v7
        with:
          repository: markup-carve/carve
          ref: cc54159dbf0227072512ae6a6bbd4a0c093210a5
          path: spec-02

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e '.[test]'

      - run: pytest -q
        env:
          CARVE_SPEC_02: spec-02
